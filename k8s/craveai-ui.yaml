apiVersion: apps/v1
kind: Deployment
metadata:
  name: craveai-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: craveai-ui
  template:
    metadata:
      labels:
        app: craveai-ui
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ui
          image: ghcr.io/saumya-ranjan-mishra/crave-ui:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: craveai-ui
spec:
  type: ClusterIP
  selector:
    app: craveai-ui
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: craveai-public
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: craveai-ui
                port:
                  number: 80