name: Build and publish CraveAI UI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - "ui/**"
      - "k8s/craveai-ui.yaml"
      - ".github/workflows/publish-ui-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-crave-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-build:
    name: Build and validate React UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

  publish-ui:
    name: Publish UI image to GHCR
    needs: ui-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/crave-ui
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ui/Dockerfile
          platforms: linux/amd64
          push: true
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max